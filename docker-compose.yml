services:
  boop-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boop-agent
    restart: unless-stopped
    # Environment variables are expected to be injected by the deployment
    # platform (e.g. Dokploy), not from a checked-in local env file.
    ports:
      - "3456:3456"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3456/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
